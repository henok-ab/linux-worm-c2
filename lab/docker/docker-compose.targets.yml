networks:
  worm-lab:
    external: true

services:
  target-1:
    image: ubuntu:22.04
    container_name: worm-target-1
    hostname: worm-target-1
    networks:
      worm-lab:
        ipv4_address: 172.28.0.11
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq openssh-server curl >/dev/null && 
               mkdir -p /run/sshd && /usr/sbin/sshd -D"
    restart: unless-stopped

  target-2:
    image: ubuntu:22.04
    container_name: worm-target-2
